services:
  - type: web
    name: taskflow-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: TaskFlow
      - key: Jwt__Audience
        value: TaskFlow
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "14"
      - key: Cors__AllowedOrigins
        sync: false
      - key: Email__Smtp__Host
        sync: false
      - key: Email__Smtp__Port
        value: "587"
      - key: Email__Smtp__Username
        sync: false
      - key: Email__Smtp__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        value: "Taskflow"
      - key: Frontend__BaseUrl
        sync: false
